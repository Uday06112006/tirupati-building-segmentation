version: '3.8'

services:
  threed-reconstruction-api:
    build:
      context: .
      dockerfile: Dockerfile
    image: ortho-generator/3d-reconstruction-api:1.0.0
    container_name: threed_generator_api
    restart: unless-stopped
    ports:
      - "8002:8002"
    environment:
      - THREED_APP_NAME=OrthoGenerator 3D Reconstruction Microservice
      - THREED_MAX_CONCURRENT_JOBS=1
    volumes:
      - ./outputs:/app/outputs
      - ../api_video_ortho/outputs:/data/video_outputs:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
