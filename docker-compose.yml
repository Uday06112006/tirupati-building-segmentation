version: '3.8'

services:
  # -------------------------------------------------------------
  # 1. Video-to-Frame & EXIF Geotagging Microservice (Port 8000)
  # -------------------------------------------------------------
  video-frame-extractor:
    build:
      context: ./api_video_ortho
      dockerfile: Dockerfile
    image: ortho-suite/video-frame-extractor:1.0.0
    container_name: ortho_video_extractor
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - APP_NAME=Drone Video Frame Geotagging Microservice
      - MAX_CONCURRENT_JOBS=2
    volumes:
      - ./api_video_ortho/outputs:/app/outputs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s

  # -------------------------------------------------------------
  # 2. 2D Survey-Grade True Orthophoto & DSM Microservice (Port 8001)
  # -------------------------------------------------------------
  ortho-generator-2d:
    build:
      context: ./api_ortho_generator
      dockerfile: Dockerfile
    image: ortho-suite/ortho-generator-2d:1.0.0
    container_name: ortho_generator_2d
    restart: unless-stopped
    ports:
      - "8001:8001"
    environment:
      - ORTHO_APP_NAME=OrthoGenerator 2D Orthomosaic Microservice
      - ORTHO_MAX_CONCURRENT_JOBS=2
    volumes:
      - ./api_ortho_generator/outputs:/app/outputs
      - ./api_video_ortho/outputs:/data/video_outputs:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    depends_on:
      - video-frame-extractor

  # -------------------------------------------------------------
  # 3. 3D SfM Point Cloud & Mesh Reconstruction Microservice (Port 8002)
  # -------------------------------------------------------------
  threed-reconstruction:
    build:
      context: ./api_3d_generator
      dockerfile: Dockerfile
    image: ortho-suite/threed-reconstruction:1.0.0
    container_name: ortho_3d_reconstruction
    restart: unless-stopped
    ports:
      - "8002:8002"
    environment:
      - THREED_APP_NAME=OrthoGenerator 3D Reconstruction Microservice
      - THREED_MAX_CONCURRENT_JOBS=1
    volumes:
      - ./api_3d_generator/outputs:/app/outputs
      - ./api_video_ortho/outputs:/data/video_outputs:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    depends_on:
      - video-frame-extractor
